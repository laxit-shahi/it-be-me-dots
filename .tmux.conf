# Reload 
bind r source-file ~/.tmux.conf \; display "Locked and Loaded"

# Rebind to set prefix to <ctrl-space>
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# vim mode in visual tmux mode?
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n M-h previous-window
bind -n M-l next-window


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable continuum auto-restore and auto-save
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'  # saves every 15 minutes

# Visual configs
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

## Status bar
set -g status on

gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top 
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold]::#S #[fg=${gray_light},nobold] | "
set -g window-status-current-format "#[fg=${cyan_soft},bold]  > #[underscore]#I:#W"
# set -g status-right "ᵒᵏ (･_･)"
# set -g status-right "(￣▽￣)ノ || (ᵒ_ᵒ)"
set -g status-right "(￣▽￣)ノ || ᵒᵏ (･_･)"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

# s/o to @hendrikmi for the status bar config

# Options
set-option -g automatic-rename on

# Util commands
# ## copy to clipboard tmux
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

## Convert select/yank to vim-motions
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

## Copy-mode line numbers gutter (disabled)
# bind-key L run-shell "$HOME/.tmux/line_numbers.sh"

## Copy mode with line numbers (disabled)
# unbind [
# bind [ run-shell "$HOME/.config/tmux/copy_mode_with_line_numbers.sh"

## Split horizontally in current directory
bind % split-window -h -c "#{pane_current_path}"

## Split vertically in current directory  
bind '"' split-window -v -c "#{pane_current_path}"

## New window in current directory
bind c new-window -c "#{pane_current_path}"


